run_name: baseline
model_name: distilbert-base-uncased
output_dir: outputs/baseline

# "Before" checkpoint: short HF fine-tune (no early stopping / no tuning).
# Targets ~82% test accuracy vs ~91% after full fine-tune (see configs/finetune.yaml).
num_train_epochs: 3
learning_rate: 3.0e-5
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
weight_decay: 0.01
warmup_ratio: 0.06
seed: 42
max_length: 128

early_stopping_patience: 0
