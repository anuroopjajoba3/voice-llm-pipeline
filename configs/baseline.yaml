run_name: baseline
model_name: distilbert-base-uncased
output_dir: outputs/baseline

# Minimal training → lower test acc (your "before" number)
num_train_epochs: 1
learning_rate: 5.0e-5
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
weight_decay: 0.0
warmup_ratio: 0.0
seed: 42
max_length: 128

# No early stopping patience for baseline
early_stopping_patience: 0
